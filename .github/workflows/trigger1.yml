name: DevSecOps Pipeline

# Triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ====== Unit tests ======
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test

  # ====== Static analysis ======
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  # ====== Build ======
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, static-analysis]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            src/
            package.json
            jest.config.js

  # ====== ANÁLISIS DINÁMICO / COMPOSICIÓN ======
  dynamic-analysis:
    name: Dynamic Analysis & Composition
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run composition tests
        run: npm test -- --testMatch="**/*.test.js"

  # ====== DOCKER BUILD ======
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: credibanco-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====== PUSH A REGISTRY (OPCIONAL) ======
  # Descomenta esto cuando tengas credenciales de DockerHub/Quay
  docker-push:
    name: Push to Container Registry
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/credibanco-app:latest
            ${{ secrets.DOCKER_USERNAME }}/credibanco-app:${{ github.sha }}
          cache-from: type=gha

  # ====== DEPLOY / GITOPS ======
  deploy:
    name: Deploy with ArgoCD
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Update image tag in values.yaml
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' helm/credibanco-app/values.yaml
      
      - name: Verify values.yaml update
        run: |
          grep -A 2 "image:" helm/credibanco-app/values.yaml
      
      - name: Commit and push updated values
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add helm/credibanco-app/values.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ====== NOTIFICACIONES ======

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, build, docker-build]
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "Pipeline failed!"
          echo "Revisar logs en: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
